[build-system]
requires = ["uv_build>=0.11.9,<0.13"]
build-backend = "uv_build"

[project]
name = "analytics-pulpproject-org"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django==5.2.16",
    "gitpython==3.1.57",
    "gunicorn==26.0.0",
    "packaging==26.2",
    "protobuf==7.35.1",
    "psycopg==3.3.4",
    "whitenoise==6.12.0",
]
classifiers = [
    "private :: Do Not Upload"
]

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"},
]
lint = [
    "ruff>=0.15.10",
]
test = [
    "pytest-django==4.13.0",
]

[tool.uv.build-backend]
module-name = ["app", "pulpanalytics"]
module-root = ""

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.settings"

[tool.ruff]
line-length = 100
extend-exclude = ["*_pb2.py"]

[tool.ruff.lint]
extend-select = ["I"]
